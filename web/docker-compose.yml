# Postgres local para el monitor. Levantar con: npm run db:up
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    ports:
      - "5433:5432" # 5433 para no chocar con un Postgres local
    volumes:
      - monitor-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor"]
      interval: 2s
      retries: 15

volumes:
  monitor-db:
